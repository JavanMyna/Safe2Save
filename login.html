<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Safe2Save</title>
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
  <link rel="manifest" href="favicon/site.webmanifest" />
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png" />
  <script>(function(){
  var d = document.documentElement;
  var t = localStorage.getItem('theme');
  if (t === 'dark') d.setAttribute('data-theme', 'dark');

  function relLum(hex) {
    var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    function lin(v){ return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  }
  function contrast(a, b) {
    var la = relLum(a), lb = relLum(b);
    var hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2*l - 1)) * s;
    var x = c * (1 - Math.abs((h/60) % 2 - 1));
    var m = l - c/2;
    var r=0,g=0,b=0;
    if (h < 60) { r=c; g=x; }
    else if (h < 120) { r=x; g=c; }
    else if (h < 180) { g=c; b=x; }
    else if (h < 240) { g=x; b=c; }
    else if (h < 300) { r=x; b=c; }
    else { r=c; b=x; }
    function f(v){ v = Math.round((v+m)*255); return ('0'+v.toString(16)).slice(-2); }
    return '#'+f(r)+f(g)+f(b);
  }
  function accentFor(hue, mode, role) {
    var L, floor, ceil, step, ref;
    if (mode === 'light') { L = 45; floor = 28; ceil = 78; step = -2; ref = '#ffffff'; }
    else if (role === 'fill') { L = 40; floor = 24; ceil = 78; step = -2; ref = '#ffffff'; }
    else { L = 60; floor = 24; ceil = 78; step = 2; ref = '#1a1a1a'; }
    var hex, i = 0;
    while (i < 20) {
      hex = hslToHex(hue, 65, L);
      if (contrast(hex, ref) >= 4.5) break;
      L += step;
      if (L < floor) { L = floor; break; }
      if (L > ceil) { L = ceil; break; }
      i++;
    }
    L = Math.max(floor, Math.min(ceil, L));
    return hslToHex(hue, 65, L);
  }
  window.accentFor = accentFor;

  var a = localStorage.getItem('appTheme') || 'indigo';
  if (a === 'crimson') {
    d.setAttribute('data-accent', 'crimson');
  } else if (a === 'custom') {
    var hue = parseInt(localStorage.getItem('accentHue'), 10);
    if (isNaN(hue) || hue < 0 || hue > 360) hue = 241; // indigo fallback hue
    d.setAttribute('data-accent', 'custom');
    var mode = (t === 'dark') ? 'dark' : 'light';
    d.style.setProperty('--accent', accentFor(hue, mode, 'fill'));
    d.style.setProperty('--accent-fg', accentFor(hue, mode, 'fg'));
  }
  // indigo (default): no data-accent; :root/[data-theme="dark"] provide it
})();</script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ratelimit.js"></script>
</head>
<body class="auth-page">
  <div id="toast" class="toast"></div>

  <div class="auth-card" id="login-form">
    <h1>Safe2Save</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="form-group">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" autocomplete="username" placeholder="Your username" />
    </div>

    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="Your password" />
    </div>

    <button class="btn btn-primary btn-block" id="login-submit">Sign In</button>
    <p class="auth-toggle">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
  </div>

  <div class="auth-card" id="signup-form" style="display:none;">
    <h1>Safe2Save</h1>
    <p class="subtitle">Create your account</p>

    <div class="form-group">
      <label for="signup-username">Username</label>
      <input type="text" id="signup-username" autocomplete="username" placeholder="Choose a username" />
    </div>

    <div class="form-group">
      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" autocomplete="new-password" placeholder="Choose a password" />
    </div>

    <div class="form-group">
      <label for="signup-confirm">Confirm password</label>
      <input type="password" id="signup-confirm" autocomplete="new-password" placeholder="Re-enter password" />
    </div>

    <button class="btn btn-primary btn-block" id="signup-submit">Create Account</button>
    <p style="font-size:0.75rem;color:var(--text-secondary);text-align:center;margin-top:0.75rem;">
      By signing up, you agree to our<br>
      <a href="terms.html" target="_blank" style="color:var(--primary);">Terms of Service</a> and
      <a href="privacy.html" target="_blank" style="color:var(--primary);">Privacy Policy</a>.
    </p>
    <p class="auth-toggle">Already have an account? <a href="#" id="show-login">Sign in</a></p>
  </div>

  <script>
    AUTH.redirectIfAuthed();

    document.getElementById("show-signup").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("login-form").style.display = "none";
      document.getElementById("signup-form").style.display = "";
    });

    document.getElementById("show-login").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("signup-form").style.display = "none";
      document.getElementById("login-form").style.display = "";
    });
    var countdownTimer = null;

    function startCountdown(seconds) {
      var loginBtn = document.getElementById("login-submit");
      var signupBtn = document.getElementById("signup-submit");
      loginBtn.disabled = true;
      signupBtn.disabled = true;

      function tick() {
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          loginBtn.disabled = false;
          signupBtn.disabled = false;
          U.toast("");
          return;
        }
        var label = seconds === 1 ? "second" : "seconds";
        U.toast("Too many attempts. Try again in " + seconds + " " + label + ".", false);
        seconds--;
      }

      if (countdownTimer) clearInterval(countdownTimer);
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    document.getElementById("login-submit").addEventListener("click", async () => {
      var rl = RATELIMIT.check();
      if (!rl.allowed) { startCountdown(rl.waitSeconds); return; }

      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      if (!username || !password) return U.toast("Please fill in both fields.");

      try {
        await AUTH.login(username, password);
        window.location.replace("dashboard.html");
      } catch (err) {
        U.toast(err.message);
      }
    });

    document.getElementById("signup-submit").addEventListener("click", async () => {
      var rl = RATELIMIT.check();
      if (!rl.allowed) { startCountdown(rl.waitSeconds); return; }

      const username = document.getElementById("signup-username").value.trim();
      const password = document.getElementById("signup-password").value;
      const confirm = document.getElementById("signup-confirm").value;

      if (!username || !password) return U.toast("Please fill in all fields.");
      if (password.length < 6) return U.toast("Password must be at least 6 characters.");
      if (password !== confirm) return U.toast("Passwords do not match.");

      try {
        const data = await AUTH.signup(username, password);
        if (data.session) {
          window.location.replace("dashboard.html");
        } else {
          U.toast("Account created! You can now sign in.", true);
          document.getElementById("signup-form").style.display = "none";
          document.getElementById("login-form").style.display = "";
          document.getElementById("login-username").value = username;
        }
      } catch (err) {
        U.toast(err.message);
      }
    });


    // Enter key submits whichever form is visible
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      if (document.getElementById("login-form").style.display !== "none") {
        document.getElementById("login-submit").click();
      } else {
        document.getElementById("signup-submit").click();
      }
    });
  </script>
</body>
</html>
