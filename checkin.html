<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Safe2Save — Check Balance</title>
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
  <link rel="manifest" href="favicon/site.webmanifest" />
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png" />
  <script>(function(){
  var d = document.documentElement;
  var t = localStorage.getItem('theme');
  if (t === 'dark') d.setAttribute('data-theme', 'dark');

  function relLum(hex) {
    var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    function lin(v){ return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
    return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  }
  function contrast(a, b) {
    var la = relLum(a), lb = relLum(b);
    var hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    var c = (1 - Math.abs(2*l - 1)) * s;
    var x = c * (1 - Math.abs((h/60) % 2 - 1));
    var m = l - c/2;
    var r=0,g=0,b=0;
    if (h < 60) { r=c; g=x; }
    else if (h < 120) { r=x; g=c; }
    else if (h < 180) { g=c; b=x; }
    else if (h < 240) { g=x; b=c; }
    else if (h < 300) { r=x; b=c; }
    else { r=c; b=x; }
    function f(v){ v = Math.round((v+m)*255); return ('0'+v.toString(16)).slice(-2); }
    return '#'+f(r)+f(g)+f(b);
  }
  function accentFor(hue, mode, role) {
    var L, floor, ceil, step, ref;
    if (mode === 'light') { L = 45; floor = 28; ceil = 78; step = -2; ref = '#ffffff'; }
    else if (role === 'fill') { L = 40; floor = 24; ceil = 78; step = -2; ref = '#ffffff'; }
    else { L = 60; floor = 24; ceil = 78; step = 2; ref = '#1a1a1a'; }
    var hex, i = 0;
    while (i < 20) {
      hex = hslToHex(hue, 65, L);
      if (contrast(hex, ref) >= 4.5) break;
      L += step;
      if (L < floor) { L = floor; break; }
      if (L > ceil) { L = ceil; break; }
      i++;
    }
    L = Math.max(floor, Math.min(ceil, L));
    return hslToHex(hue, 65, L);
  }
  window.accentFor = accentFor;

  var a = localStorage.getItem('appTheme') || 'indigo';
  if (a === 'crimson') {
    d.setAttribute('data-accent', 'crimson');
  } else if (a === 'custom') {
    var hue = parseInt(localStorage.getItem('accentHue'), 10);
    if (isNaN(hue) || hue < 0 || hue > 360) hue = 241; // indigo fallback hue
    d.setAttribute('data-accent', 'custom');
    var mode = (t === 'dark') ? 'dark' : 'light';
    d.style.setProperty('--accent', accentFor(hue, mode, 'fill'));
    d.style.setProperty('--accent-fg', accentFor(hue, mode, 'fg'));
  }
  // indigo (default): no data-accent; :root/[data-theme="dark"] provide it
})();</script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <div id="toast" class="toast"></div>

  <nav class="nav">
    <span class="nav-title">Check Balance</span>
    <div class="desktop-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="log.html">Log</a>
      <a href="checkin.html" class="active">Check</a>
      <a href="settings.html">Settings</a>
    </div>
    <a href="dashboard.html" class="nav-btn nav-mobile-only">Done</a>
  </nav>

  <main class="page">
    <div class="card">
      <h2>Enter your current balance</h2>
      <div class="form-group">
        <label for="balance-input">Bank balance (RM)</label>
        <input type="number" id="balance-input" inputmode="decimal" step="0.01" min="0" placeholder="0.00" autofocus />
      </div>
      <button class="btn btn-primary btn-block" id="check-btn">Calculate Safe-to-Save</button>
    </div>

    <div class="card" id="result-card" style="display:none;">
      <h2>Recommendation</h2>

      <div class="balance-stat-card" style="margin-bottom:1rem;">
        <div class="result-label" style="margin-bottom:0.15rem;">Current Balance</div>
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <span class="currency" id="res-balance" style="font-size:1.4rem;font-weight:700;">—</span>
          <span id="res-trend" style="font-size:1rem;"></span>
        </div>
      </div>

      <div class="result-grid" id="result-grid">
        <div class="result-item">
          <div class="result-label">Avg Daily Spend</div>
          <div class="result-value currency" id="res-avg">—</div>
        </div>
        <div class="result-item">
          <div class="result-label">Floor (keep)</div>
          <div class="result-value currency" id="res-floor">—</div>
        </div>
        <div class="result-item highlight">
          <div class="result-label">Safe to Save</div>
          <div class="result-value currency" id="res-safe">—</div>
        </div>
      </div>

      <div class="result-summary" id="result-summary"></div>
    </div>

    <div class="card" id="history-card">
      <h2>Check-in History</h2>
      <div class="empty-state" id="history-empty">
        <div class="empty-icon">&#128203;</div>
        <p>No balance checks yet. Enter your balance above to get started.</p>
      </div>
      <div id="history-list"></div>
    </div>
  </main>

  <nav class="tab-bar">
    <a href="dashboard.html">
      <span class="tab-icon">&#9776;</span> Dashboard
    </a>
    <a href="log.html">
      <span class="tab-icon">+</span> Log
    </a>
    <a href="checkin.html" class="active">
      <span class="tab-icon">&#10003;</span> Check
    </a>
    <a href="settings.html">
      <span class="tab-icon">&#9881;</span> Settings
    </a>
  </nav>

  <script>
    let userId = null;

    async function init() {
      const session = await AUTH.requireAuth();
      if (!session) return;
      userId = session.user.id;
      loadHistory();
    }

    async function getSettings() {
      const { data } = await db
        .from("settings")
        .select("*")
        .eq("user_id", userId)
        .single();

      return {
        runway_days: data?.runway_days ?? 14,
        starting_daily_estimate: parseFloat(data?.starting_daily_estimate ?? 0),
      };
    }

    async function computeRecommendation(balance) {
      const settings = await getSettings();
      const runwayDays = settings.runway_days;

      // Get previous check-in for trend
      var prevBalance = null;
      try {
        var { data: prev } = await db.from("balance_checkins").select("balance").eq("user_id", userId).order("checked_at", { ascending: false }).limit(1);
        if (prev && prev.length > 0) prevBalance = parseFloat(prev[0].balance);
      } catch(e) {}

      let { data: allTx } = await db
        .from("transactions")
        .select("occurred_on")
        .eq("user_id", userId)
        .eq("type", "expense")
        .order("occurred_on", { ascending: true });

      allTx = (allTx || []).filter(function(t) { return U.isRealSpend(t); });

      if (!allTx || allTx.length === 0) {
        return {
          avgDailySpend: settings.starting_daily_estimate,
          floor: settings.starting_daily_estimate * runwayDays,
          safeToSave: Math.max(0, balance - settings.starting_daily_estimate * runwayDays),
          runwayDays,
          prevBalance,
        };
      }

      const allDates = [...new Set(allTx.map((t) => t.occurred_on))].sort();
      const historyDays = U.daysBetween(allDates[0], U.todayStr()) + 1;

      const windowSize = historyDays < 14 ? 14 : 30;
      const cutoff = U.daysAgoStr(windowSize);

      let { data: transactions } = await db
        .from("transactions")
        .select("*")
        .eq("user_id", userId)
        .eq("type", "expense")
        .gte("occurred_on", cutoff)
        .order("occurred_on", { ascending: true });

      transactions = (transactions || []).filter(function(t) { return U.isRealSpend(t); });

      const windowDates = [...new Set((transactions || []).map((t) => t.occurred_on))];
      const uniqueDays = windowDates.length;

      let avgDailySpend;
      if (uniqueDays < 5 && settings.starting_daily_estimate > 0) {
        avgDailySpend = settings.starting_daily_estimate;
      } else {
        const total = U.spendTotal(transactions || []);
        // Divide by the smaller of windowSize and historyDays so that
        // accounts without a full window of history don't treat
        // pre-existence days as verified zero-spend days, which would
        // deflate the daily average and overstate safe-to-save.
        avgDailySpend = total / Math.min(windowSize, historyDays);
      }

      const floor = avgDailySpend * runwayDays;
      const safeToSave = Math.max(0, balance - floor);

      return { avgDailySpend, floor, safeToSave, runwayDays, lowConfidence: uniqueDays < 5, prevBalance };
    }

    document.getElementById("check-btn").addEventListener("click", async () => {
      const raw = document.getElementById("balance-input").value;
      const balance = parseFloat(raw);
      if (!raw || isNaN(balance) || balance < 0) {
        return U.toast("Please enter a valid balance.");
      }

      document.getElementById("check-btn").disabled = true;
      document.getElementById("check-btn").textContent = "Calculating...";

      try {
        const rec = await computeRecommendation(balance);

        document.getElementById("res-balance").textContent = U.fmtMYR(balance);
        document.getElementById("res-avg").textContent = U.fmtMYR(rec.avgDailySpend);
        document.getElementById("res-floor").textContent = U.fmtMYR(rec.floor);
        document.getElementById("res-safe").textContent = U.fmtMYR(rec.safeToSave);

        // Trend vs last check-in
        var trendEl = document.getElementById("res-trend");
        trendEl.textContent = "";
        if (rec.prevBalance != null) {
          var diff = balance - rec.prevBalance;
          if (diff > 0) trendEl.innerHTML = '<span style="color:var(--green);">&#8593; ' + U.fmtMYR(diff) + '</span>';
          else if (diff < 0) trendEl.innerHTML = '<span style="color:var(--red);">&#8595; ' + U.fmtMYR(Math.abs(diff)) + '</span>';
          else trendEl.innerHTML = '<span style="color:var(--text-secondary);">&#8212;</span>';
        }

        document.getElementById("result-summary").innerHTML =
          rec.safeToSave > 0
            ? `Keep at least <strong>${U.fmtMYR(rec.floor)}</strong> for the next <strong>${rec.runwayDays} days</strong>. <strong>${U.fmtMYR(rec.safeToSave)}</strong> is safe to move to savings.`
            : `Your balance of <strong>${U.fmtMYR(balance)}</strong> is below the recommended floor of <strong>${U.fmtMYR(rec.floor)}</strong>. Nothing is safe to save right now.`;

        if (rec.lowConfidence) {
          document.getElementById("result-summary").innerHTML +=
            '<div style="margin-top:0.5rem;font-size:0.75rem;color:var(--text-secondary);">Still calibrating — not yet 5 days of spending history.</div>';
        }

        document.getElementById("result-card").style.display = "";

        await db.from("balance_checkins").insert({
          user_id: userId,
          balance,
          avg_daily_spend: rec.avgDailySpend,
          floor_amount: rec.floor,
          safe_to_save: rec.safeToSave,
        });

        loadHistory();
      } catch (err) {
        U.toast("Something went wrong. Try again.");
      }

      document.getElementById("check-btn").disabled = false;
      document.getElementById("check-btn").textContent = "Calculate Safe-to-Save";
    });

    async function loadHistory() {
      const { data } = await db
        .from("balance_checkins")
        .select("*")
        .eq("user_id", userId)
        .order("checked_at", { ascending: false })
        .limit(10);

      const container = document.getElementById("history-list");
      const empty = document.getElementById("history-empty");

      if (!data || data.length === 0) {
        container.innerHTML = "";
        empty.style.display = "";
        return;
      }

      empty.style.display = "none";
      container.innerHTML = data
        .map(
          (c) => `
        <div class="history-row">
          <div>
            <div>Balance: <strong>${U.fmtMYR(c.balance)}</strong></div>
            <div class="history-date">${U.fmtDate(c.checked_at)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:600;color:var(--green-dark);">${U.fmtMYR(c.safe_to_save)}</div>
            <div style="font-size:0.7rem;color:var(--text-secondary);">safe to save</div>
          </div>
        </div>
        <div style="font-size:0.68rem;color:var(--text-secondary);">
          avg ${U.fmtMYR(c.avg_daily_spend)}/day · floor ${U.fmtMYR(c.floor_amount)}
        </div>`
        )
        .join("");
    }

    // Enter key submits
    document.getElementById("balance-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("check-btn").click();
    });

    init();
  </script>
</body>
</html>
